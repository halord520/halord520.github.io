<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>关注抖音@哈罗德</title>
    <style>
        body { margin:0; padding:20px; text-align:center; font-family: sans-serif; }
        .avatar { width:90px; height:90px; border-radius:50%; margin:20px auto; display:block; }
        h2 { margin:10px 0 0; }
        .btn {
            display: inline-block;
            background: #fe2c55;
            color: #fff;
            font-size: 18px;
            padding: 12px 50px;
            border-radius: 30px;
            text-decoration: none;
            margin-top: 30px;
            border: none;
            cursor: pointer;
        }
        .tip { color: #888; margin-top: 25px; font-size: 14px; display: none; }
        .tip b { color: #000; }
    </style>
</head>
<body>
    <img class="avatar" src="https://picsum.photos/200/200" alt="头像" id="avatar">
    <h2 id="nickname">@哈罗德</h2>
    <p style="color:#666;">抖音号：2014061759</p>

    <button class="btn" onclick="goFollow()">打开抖音关注</button>
    <div class="tip" id="guideTip">
        请点击右上角「...」选择 <b>在浏览器中打开</b><br>或复制抖音号 <b>2014061759</b> 去搜索关注
    </div>

    <script>
        const USER_SEC_UID = 'MS4wLjABAAAA61AzlK1Ef1uLVsNTieOMAT9Th57QEucVyvMc-OV5dZM';  
        const DOUYIN_ID = '2014061759';              

        // 判断当前环境
        const ua = navigator.userAgent;
        const isWechat = /MicroMessenger/i.test(ua);
        const isDouyin = /aweme/i.test(ua);
        const isAlipay = /AlipayClient/i.test(ua);

        // 填入昵称头像（可写死）
        document.getElementById('avatar').src = 'https://picsum.photos/200/200';
        document.getElementById('nickname').innerText = '@哈罗德';

        function goFollow() {
            // 抖音内：跳转到用户主页（需要手动点关注）
            if (isDouyin) {
                window.location.href = 'https://www.douyin.com/user/' + USER_SEC_UID;
                return;
            }

            // 其他环境：尝试唤起抖音 App，失败则跳转网页版主页
            const scheme = 'snssdk1128://aweme/user/profile?uid=' + USER_SEC_UID;
            const fallback = 'https://www.douyin.com/user/' + USER_SEC_UID;

            // 使用一个隐藏的 <a> 标签触发 scheme（更不容易被拦截）
            const link = document.createElement('a');
            link.href = scheme;
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            // 如果 2 秒内没有离开页面，说明唤起失败，跳转到网页版
            const timer = setTimeout(function() {
                window.location.href = fallback;
            }, 2000);

            // 如果页面进入后台（说明成功唤起了 App），清除定时器
            window.addEventListener('pagehide', function() {
                clearTimeout(timer);
            });
        }
    

        // 页面加载时可以显示用户头像昵称，如果有动态接口就用，没有就写死
        // 这里示例直接写死了图片和昵称，你替换 src 和文本就行
        document.getElementById('avatar').src = 'https://picsum.photos/200/200';  // 替换
        document.getElementById('nickname').innerText = '@哈罗德'; // 替换
    </script>
</body>
</html>
